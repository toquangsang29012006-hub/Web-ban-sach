<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sách</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/product-detail.css" />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <i class="fa-solid fa-bars icon-start" id="nav-open"></i>
        <img src="./images/Logo.jpg" alt="Logo" class="img-logo" />
        <ul class="nav-list" id="show-menu">
          <i class="fa-solid fa-x icon-end" id="nav-close"></i>
          <li class="nav-item">
            <a href="index.html" class="nav-link active">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">Danh mục sách</a>
          </li>
          <li class="nav-item">
            <a href="index.html #about" class="nav-link">Giới thiệu</a>
          </li>
          <li class="nav-item">
            <a href="#contacs" class="nav-link">Liên hệ</a>
          </li>
        </ul>
        <ul class="nav-icon">
          <li class="nav-item">
            <a href="" class="nav-link"> <i class="fa-solid fa-cart-shopping"></i> <span>Giỏ hàng</span> </a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link"> <i class="fa-solid fa-circle-user"></i> <span> Đăng nhập</span> </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="main">
      <div class="container">
        <article class="item-book">
          <h1 class="book-name">Sách Tiếng Anh</h1>
          <hr />
          <img src="./images/book-discount-1.jpg" alt="book" />
          <hr />
          <p class="price">Giá tiền: <span>185.000đ</span></p>
          <form class="quanlity">
            <label for="quanlity">Số lượng: </label>
            <input type="number" id="quanlity" class="quantity-book" value="1" min="1" />
          </form>
          <div class="buttons">
            <button class="btn-add-cart">Thêm vào giỏ hàng</button>
            <button class="btn-buy-now">Mua ngay</button>
          </div>
        </article>
      </div>
    </main>

    <footer class="footer" id="contacs">
      <aside class="address">
        <h2 class="title">Địa chỉ</h2>
        <figure>
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2336.0986733910663!2d105.76863478138982!3d10.030553578629661!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31a0895a51d60719%3A0x9d76b0035f6d53d0!2zxJDhuqFpIGjhu41jIEPhuqduIFRoxqE!5e0!3m2!1svi!2s!4v1792245297017!5m2!1svi!2s"
            width="350"
            height="300"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </figure>
        <div class="information">
          <i class="fa-solid fa-location-dot"></i>
          <p class="text">Khu II, Đ. 3 Tháng 2, Ninh Kiều, Cần Thơ, Việt Nam</p>
        </div>
      </aside>
      <section class="contacs">
        <h2 class="title">Liên hệ</h2>
        <ul class="list-contacs">
          <li class="item-contacs">
            <i class="fa-solid fa-phone"></i>
            <p>0123456789</p>
          </li>
          <li class="item-contacs">
            <i class="fa-solid fa-envelope"></i>
            <p>admin123@gmail.com</p>
          </li>
        </ul>
      </section>
    </footer>

    <script src="./js/script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/cart.css">
    
</head>
<body>  
    <header class="header">
        <nav class="nav">
            <i class="fa-solid fa-bars icon-start" id="nav-open"></i>
            <img src="./images/Logo.jpg" alt="Logo" class="img-logo">
            <ul class="nav-list" id="show-menu">
                <i class="fa-solid fa-x icon-end" id="nav-close"></i>
                <li class="nav-item">
                    <a href="" class="nav-link active">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a href="" class="nav-link">Danh mục sách</a>
                </li>
                <li class="nav-item">
                    <a href="#about" class="nav-link">Giới thiệu</a>
                </li>
                <li class="nav-item">
                    <a href="#contacs" class="nav-link">Liên hệ</a>
                </li>
            </ul>
            <ul class="nav-icon">
                <li class="nav-item">
                    <a href="" class="nav-link">
                        <i class="fa-solid fa-cart-shopping"></i> <span>Giỏ hàng</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="" class="nav-link">
                        <i class="fa-solid fa-circle-user"></i> <span> Đăng nhập</span>
                    </a>
                </li>
            </ul>
        </nav>  
    </header>
    <main class="main">
        <div class="container">
            <div class="main-content">
                <p class="show d-none">Không có sản phẩm nào được chọn</p>
                <article class="item-product">
                    <input type="checkbox">
                    <img src="./images/book-new-1.webp" alt="" class="img-product">
                    <div class="product-info">
                        <h4 class="book-name"> Sách 1</h4>
                        <p class="book-price">120.000đ</p>
                    </div>
                    <p class="so-luong">1</p>
                    <button class="btn-delete">Xóa</button>
                </article>
                <article class="item-product">
                    <input type="checkbox">
                    <img src="./images/book-new-1.webp" alt="" class="img-product">
                    <div class="product-info">
                        <h4 class="book-name"> Sách 1</h4>
                        <p class="book-price">120.000đ</p>
                    </div>
                    <p class="so-luong">1</p>
                    <button class="btn-delete">Xóa</button>
                </article>
            </div>
        </div>
    </main>

        
    <footer class="footer">
        <form class="checked-all">
            <label for="all">Tất cả</label>
            <input type="checkbox" id="all">
        </form>
        <div class="sum-buy">
            <p>Tổng: <span class="sum-price">120.000đ</span></p>
            <button class="btn-buy">Mua hàng</button>
        </div>
    </footer>

</body>
</html>

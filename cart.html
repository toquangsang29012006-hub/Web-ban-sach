<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

    <div class="cart-container">
        
        
        <div class="row-header">
            <span>←</span>
            <span class="header-tittle">Giỏ hàng</span>
            <span></span>
           
        </div>

       
        <div class="row-shop-title">
            <div class="shop-left">
                <input type="checkbox">
                <span class="shop-name"> Nhóm 3 &gt;</span>
            </div>
            <button class="edit-btn">Xóa</button>
        </div>

       
        <div class="row-product">
            <input type="checkbox" style="margin-top: 5px;">
            
            <div class="product-img-wrapper">
                <span>hình ảnh</span>
                <div class="stock-badge">Chỉ còn 4</div>
            </div>

            <div class="product-info">
                <div class="product-name"> Sách [tên sách]</div>
                <div class="product-variant">Đen</div>
                <div class="product-price">.000VNĐ</div>
            </div>

            <div class="quantity-box">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
        </div>

        
        <div class="row-voucher">
            <span>Voucher shop</span>
            <span style="color: #888;">></span>
        </div>

       
        <div class="row-footer">
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="all">
                <label for="all" style="cursor: pointer;">Tất cả</label>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div>Tổng: <span class="total-price">.000VNĐ</span></div>
                <button class="buy-btn">Mua hàng</button>
            </div>
        </div>

    </div>

</body>
</html>

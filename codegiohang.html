<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaedf0;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .cart-container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        
        .row-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
        }
        .header-tittle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        
        .row-shop-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            margin-top: 5px;
        }

        .shop-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shop-name {
            font-weight: bold;
            font-size: 16px;
            color: #222;
        }

        .edit-btn {
            color: #777;
            cursor: pointer;
            font-size: 14px;
        }

       
        .row-product {
            display: flex;
            align-items: flex-start;
            padding: 15px 20px;
            gap: 12px;
            border-bottom: 8px solid #f5f5f5;
            background: #fff;
        }

        
        .product-img-wrapper {
            position: relative;
            width: 85px;
            height: 85px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #fafafa;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #777;
        }

        .stock-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 10px;
            text-align: center;
            padding: 2px 0;
        }

        
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-name {
            font-size: 15px;
            color: #222;
            line-height: 1.3;
        }

        .product-variant {
            font-size: 13px;
            color: #777;
        }

       
        .voucher-tag {
            display: inline-block;
            background: #fff4f4;
            color: #ee4d2d;
            border: 1px solid #f9aca3;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 2px;
            width: fit-content;
            margin: 2px 0;
        }

        .product-price {
            color: #ee4d2d;
            font-weight: bold;
            font-size: 16px;
            margin-top: 4px;
        }

       
        .quantity-box {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            align-self: flex-end; /* Nằm phía dưới bên phải của sản phẩm */
        }

        .quantity-box button {
            border: none;
            background: #f8f8f8;
            padding: 4px 10px;
            cursor: pointer;
            color: #555;
        }

        .quantity-box span {
            padding: 0 10px;
            font-size: 14px;
        }

        
        .row-voucher {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 8px solid #f5f5f5;
            font-size: 15px;
            cursor: pointer;
            background: #fff;
        }

       
        .row-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #fff;
        }

        .total-price {
            color: #ee4d2d;
            font-weight: bold;
            font-size: 16px;
        }

        .buy-btn {
            background: #ee2d2d;
            color: white;
            border: none;
            padding: 10px 22px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="cart-container">
        
        
        <div class="row-header">
            <span>←</span>
            <span class="header-tittle">Giỏ hàng</span>
            <span></span>
           
        </div>

       
        <div class="row-shop-title">
            <div class="shop-left">
                <input type="checkbox">
                <span class="shop-name"> Nhóm 3 &gt;</span>
            </div>
            <button class="edit-btn">Xóa</button>
        </div>

       
        <div class="row-product">
            <input type="checkbox" style="margin-top: 5px;">
            
            <div class="product-img-wrapper">
                <span>hình ảnh</span>
                <div class="stock-badge">Chỉ còn 4</div>
            </div>

            <div class="product-info">
                <div class="product-name"> Sách [tên sách]</div>
                <div class="product-variant">Đen</div>
                <div class="product-price">.000VNĐ</div>
            </div>

            <div class="quantity-box">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
        </div>

        
        <div class="row-voucher">
            <span>Voucher shop</span>
            <span style="color: #888;">></span>
        </div>

       
        <div class="row-footer">
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="all">
                <label for="all" style="cursor: pointer;">Tất cả</label>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div>Tổng: <span class="total-price">.000VNĐ</span></div>
                <button class="buy-btn">Mua hàng</button>
            </div>
        </div>

    </div>

</body>
</html>

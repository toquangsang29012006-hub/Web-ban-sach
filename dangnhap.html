<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="./css/dangnhap.css">
</head>
<body>
  <main class="main">
    <h1 class="title">Đăng nhập</h1>
    <form class="form" id="form" action="#">
      <div class="form-item">
        <label for="email">Email</label>
        <input class="input-email" type="text" name="email" id="email" placeholder="Nhập email..." required>
      </div>
      
      <div class="form-item">
        <label for="password">Mật khẩu</label>
        <input class="type-password" type="password" name="password" id="password" placeholder="Nhập mật khẩu..." required>
      </div>

       <div class="form-row-submit">
            <button class="btn-submit" type="submit">Đăng nhập</button>
        </div>
    </form>

    <p class="text-link">Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a></p>
    <script src="./js/dangnhap.js"></script>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="./css/dangnhap.css">
</head>
<body>
    <main class="main">
        <h1 class="title">Đăng ký</h1>

        <form class="form" action="/dangnhap.html" method="POST" id="form">
            <div class="form-item">
                <label for="fullname">Họ và tên</label>
                <input class="type-text" type="text" name="fullname" id="fullname" placeholder="Nhập họ và tên" required>
            </div>
            <div class="form-item">
                <label for="email">Email</label>
                <input class="type-text" type="email" name="email" id="email" placeholder="Nhập email" required>
            </div>
            <div class="form-item">
                <label for="password">Mật khẩu</label>
                <input class="type-password" type="password" name="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <div class="form-item">
                <label for="date">Ngày sinh</label>
                <input class="type-text" type="date" name="date" id="date" required>
            </div>
            <div class="form-item">
                <label for="address">Địa chỉ</label>
                <input class="type-text" type="address" name="address" id="address" required>
            </div>
            <div class="form-row-submit">
                <button class="btn-submit" id="btn-submit" type="submit">Đăng ký</button>
            </div>
        </form>
    </main>

    <script src="./js/dangky.js"></script>
</body>
</html>
